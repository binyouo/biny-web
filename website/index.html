<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biny · 一个记得你的 AI 伙伴</title>
    <meta
      name="description"
      content="Biny 是在你电脑上的 AI 伙伴。记住聊过的偏好，找回看过的内容，用你喜欢的模型聊天、写作和做事。支持 macOS 桌面端与终端。"
    />
    <meta name="keywords" content="Biny, AI 伙伴, Computer History, 长期记忆, Sleep, Markdown, 本地优先, macOS, CLI, TUI" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://biny.online/zh/" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon-1024.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Biny" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="Biny · 一个记得你的 AI 伙伴" />
    <meta
      property="og:description"
      content="记住你的偏好，找回看过的内容。Biny 在你的电脑上，陪你聊想法，也帮你把事情做完。"
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("biny-site-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <main>
        <h1>Biny</h1>

      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
