<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      /* 社交分享图模板。渲染命令见 website/README.md。 */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 30px;
        padding: 0 88px;
        background: #111111;
        color: #eeeeee;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
        overflow: hidden;
      }
      .row { position: relative; display: flex; align-items: center; gap: 22px; }
      .row img { width: 84px; height: 84px; }
      .row span { font-size: 40px; font-weight: 650; letter-spacing: -0.02em; }
      h1 { position: relative; font-size: 82px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.1; }
      p { position: relative; max-width: 940px; font-size: 28px; line-height: 1.55; color: #b3b3b3; }
    </style>
  </head>
  <body>
    <div class="row">
      <img src="/icon-1024.png" alt="" />
      <span>Biny</span>
    </div>
    <h1>把想法，交给 Biny。</h1>
    <p>本地优先的 AI Agent，在 macOS 桌面端或终端里直接进入你的工作区，完成编码、研究和文件处理。</p>
  </body>
</html>
